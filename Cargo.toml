[package]
name = "osm-surface"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
flate2 = "1.1.10"
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2", "json"] }
rstar = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "decompression-gzip", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
