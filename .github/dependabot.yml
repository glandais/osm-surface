version: 2
updates:
  # Rust crates (Cargo.toml / Cargo.lock): minor and patch updates in one PR
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  # Base images of the Dockerfile (rust build image, distroless runtime)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
